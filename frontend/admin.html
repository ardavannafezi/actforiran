<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود مدیران | ActForIran</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body">
    <div class="bg-ornament"></div>
    <div class="bg-grid"></div>

    <main class="admin-shell">
        <section class="admin-login" id="loginView">
            <header>
                <span class="admin-eyebrow">پنل مدیران</span>
                <h1>ورود امن</h1>
                <p>فقط برای مدیران تاییدشده. ورود شما ثبت می‌شود.</p>
            </header>
            <form id="loginForm" class="admin-form">
                <label>
                    ایمیل
                    <input type="email" id="adminEmail" required autocomplete="username">
                </label>
                <label>
                    رمز عبور
                    <input type="password" id="adminPassword" required autocomplete="current-password">
                </label>
                <button type="submit" class="primary">ورود</button>
                <p class="form-hint" id="loginError"></p>
            </form>
        </section>

        <section class="admin-dashboard" id="dashboardView" aria-hidden="true">
            <header class="dashboard-header">
                <div>
                    <h2>داشبورد مدیران</h2>
                    <p id="adminMeta">در حال بارگذاری...</p>
                </div>
                <button id="logoutBtn" class="ghost">خروج</button>
            </header>

            <nav class="dashboard-nav">
                <button class="nav-pill active">خلاصه</button>
                <button class="nav-pill">مخاطبان</button>
                <button class="nav-pill">موضوعات</button>
                <button class="nav-pill">گزارش‌ها</button>
            </nav>

            <section class="dashboard-grid">
                <div class="stat-card">
                    <h3>نقش شما</h3>
                    <p id="adminRole">-</p>
                </div>
                <div class="stat-card">
                    <h3>وضعیت</h3>
                    <p>متصل</p>
                </div>
                <div class="stat-card">
                    <h3>مرحله بعد</h3>
                    <p>مدیریت مخاطبان و موضوعات در Sprint 3</p>
                </div>
            </section>
        </section>
    </main>

    <script src="/js/admin.js"></script>
</body>
</html>
